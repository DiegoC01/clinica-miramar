<section class="border-b border-slate-900/[0.06] bg-white py-10">
  <div class="mx-auto max-w-6xl px-6">
    <nav class="flex items-center gap-2 text-xs font-medium text-slate-500" aria-label="Ruta de navegación">
      <a href="/" class="hover:text-teal-700">Inicio</a>
      <span aria-hidden="true">/</span>
      <span class="font-semibold text-slate-900">Especialistas</span>
    </nav>

    <div class="mt-3 flex flex-wrap items-end justify-between gap-4">
      <div>
        <h1 class="font-display text-3xl font-extrabold tracking-tight text-slate-950">Directorio de Especialistas</h1>
        <p class="mt-1.5 text-sm text-slate-600">
          Combina búsqueda por texto, especialidad y modalidad de atención para encontrar tu hora.
        </p>
      </div>
      <p class="rounded-full bg-sand-100 px-3.5 py-1 text-xs font-semibold text-slate-700 tabular-nums">{{results_count}}</p>
    </div>

    <form action="/especialistas" method="get" role="search" class="mt-6 flex flex-col gap-3 sm:flex-row">
      {{hidden_esp}}
      {{hidden_mod}}
      <div class="relative flex-1 max-w-xl">
        <svg class="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input
          type="text"
          name="q"
          value="{{query_value}}"
          placeholder="Buscar por nombre, especialidad o motivo de consulta..."
          aria-label="Buscar especialista"
          class="w-full rounded-xl border border-slate-300 bg-white py-2.5 pl-10 pr-4 text-sm text-slate-900 placeholder:text-slate-400 focus:border-teal-700 focus:outline-none focus:ring-2 focus:ring-teal-700/15"
        />
      </div>
      <button type="submit" class="inline-flex items-center justify-center rounded-xl bg-teal-700 px-5 py-2.5 text-sm font-semibold text-white shadow-xs transition hover:bg-teal-800 cursor-pointer">
        Aplicar búsqueda
      </button>
    </form>

    <div class="mt-5 flex flex-col gap-3 border-t border-slate-100 pt-5 lg:flex-row lg:items-center lg:justify-between">
      <div class="flex flex-wrap items-center gap-2">
        {{specialty_chips}}
      </div>
      <div class="flex flex-wrap items-center gap-2">
        {{modality_chips}}
      </div>
    </div>
  </div>
</section>

<section class="py-10">
  <div class="mx-auto max-w-6xl px-6">
    {{active_filters}}
    <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-4">
      {{doctors_cards}}
    </div>
  </div>
</section>
