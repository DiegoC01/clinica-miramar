{{portal_header}}

<section class="py-8">
  <div class="mx-auto max-w-6xl px-6">
    <div class="card-elevated rounded-2xl overflow-hidden">
      <div class="border-b border-slate-100 p-6">
        <div class="flex flex-wrap items-end justify-between gap-4">
          <div>
            <div class="flex items-center gap-2.5">
              <h2 class="font-display text-xl font-bold text-slate-950">Resultados de Exámenes e Imagenología</h2>
              <span id="exam-visible-count" class="rounded-full bg-sand-100 px-2.5 py-0.5 text-xs font-bold text-slate-700 tabular-nums">{{records_count}} de {{records_count}}</span>
            </div>
            <p class="mt-1 text-xs text-slate-500">Filtra por tipo de estudio o busca por examen, médico o número de folio.</p>
          </div>
        </div>

        <div class="mt-5 flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
          <div class="flex flex-wrap gap-2" role="group" aria-label="Filtrar por categoría de examen">
            <button type="button" data-result-cat="todos" aria-pressed="true" class="rounded-full bg-pine-950 px-3.5 py-1.5 text-xs font-semibold text-white shadow-xs transition cursor-pointer">Todos</button>
            <button type="button" data-result-cat="laboratorio" aria-pressed="false" class="rounded-full bg-sand-100 px-3.5 py-1.5 text-xs font-semibold text-slate-700 transition hover:bg-sand-200 cursor-pointer">Laboratorio</button>
            <button type="button" data-result-cat="imagenología" aria-pressed="false" class="rounded-full bg-sand-100 px-3.5 py-1.5 text-xs font-semibold text-slate-700 transition hover:bg-sand-200 cursor-pointer">Imagenología</button>
            <button type="button" data-result-cat="cardiología" aria-pressed="false" class="rounded-full bg-sand-100 px-3.5 py-1.5 text-xs font-semibold text-slate-700 transition hover:bg-sand-200 cursor-pointer">Cardiología</button>
          </div>

          <div class="relative w-full md:w-72">
            <svg class="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input
              id="exam-filter"
              type="search"
              placeholder="Buscar examen, médico o folio..."
              aria-label="Buscar resultados"
              class="w-full rounded-xl border border-slate-200 bg-sand-50 py-2 pl-10 pr-4 text-xs text-slate-900 placeholder:text-slate-400 focus:border-teal-700 focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-700/15"
            />
          </div>
        </div>
      </div>

      <div class="divide-y divide-slate-100">
        {{records_rows}}
        <div id="exam-empty-row" class="hidden px-6 py-12 text-center text-sm text-slate-500">
          No existen estudios que coincidan con los filtros seleccionados.
        </div>
      </div>
    </div>
  </div>
</section>
